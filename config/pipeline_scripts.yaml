# Pipeline / ops scripts — SSOT（非 Research topic）
# 盤點：docs/research-script-inventory.md
# 對照：config/pipelines/daily_close.yaml · scripts/launchd/

version: pipeline-scripts-v1

scripts:
  run_rrg_universe_close:
    path: scripts/run_rrg_universe_close.py
    layer: pipeline
    pipeline: daily_close
    node: rrg_universe_close
    module: src/rrg_universe_snapshot.py
    env_flag: RUN_RRG_UNIVERSE_CLOSE

  compute_xq_style_metrics:
    path: scripts/research/compute_xq_style_metrics.py
    layer: pipeline
    pipeline: daily_close
    node: xq_style_metrics
    env_flag: RUN_XQ_STYLE_METRICS

  run_vcp_funnel_close:
    path: scripts/run_vcp_funnel_close.py
    layer: pipeline
    pipeline: daily_close
    node: vcp_funnel_close
    module: src/vcp_funnel_specs_daily.py
    env_flag: RUN_VCP_FUNNEL_CLOSE
    strategy_ids: [vcp-pivot-gate, vcp-coil-close]

  run_vcp_funnel_intraday:
    path: scripts/run_vcp_funnel_intraday.py
    layer: pipeline
    pipeline: launchd
    launchd: scripts/launchd/vcp-funnel-specs.command
    module: src/vcp_funnel_specs_daily.py
    strategy_ids: [vcp-pivot-gate, vcp-coil-close]

  run_copytrade_l1h9_daily_brief:
    path: scripts/run_copytrade_l1h9_daily_brief.py
    layer: pipeline
    pipeline: daily_close
    node: copytrade_l1h9_screen
    module: src/copytrade_l1h9_daily.py
    strategy_id: 00981a-l1h9

  run_rrg_mono_intraday_watch:
    path: scripts/run_rrg_mono_intraday_watch.py
    layer: pipeline
    pipeline: launchd
    launchd: scripts/launchd/rrg-mono-intraday-watch.command
    module: src/rrg_mono_intraday_watch.py
    parent_strategy: rrg-mono-hold7

  run_mutual_fund_disclosure_watch:
    path: scripts/run_mutual_fund_disclosure_watch.py
    layer: pipeline
    pipeline: launchd
    launchd: scripts/launchd/mutual-fund-disclosure-watch.command
    module: src/mutual_fund_disclosure_watch.py

  run_minervini_sepa_daily_brief:
    path: scripts/run_minervini_sepa_daily_brief.py
    layer: pipeline
    pipeline: launchd
    launchd: scripts/launchd/minervini-sepa-basket.command
    module: src/minervini_sepa_daily.py
    strategy_id: minervini-sepa-basket

  run_rrg_universe_timeline_daily:
    path: scripts/run_rrg_universe_timeline_daily.py
    layer: pipeline
    pipeline: daily_close
    node: rrg_universe_timeline_daily
    module: scripts/run_rrg_universe_timeline_daily.py
    env_flag: RUN_RRG_UNIVERSE_TIMELINE

  run_sync_mutual_fund_holdings:
    path: scripts/run_sync_mutual_fund_holdings.py
    layer: pipeline
    pipeline: manual
    module: src/sync_mutual_fund_holdings.py

  run_market_breadth_report:
    path: scripts/run_market_breadth_report.py
    layer: regime
    purpose: Breadth zone standalone HTML · 非 daily close
    report_dir: reports/research/breadth

  run_unified_backtest_comparison:
    path: scripts/run_unified_backtest_comparison.py
    layer: research
    purpose: 跨軌比較層 league table · docs/unified-backtest-standard.md
    report_dir: reports/research/_unified

  run_cross_strategy_ensemble:
    path: scripts/run_cross_strategy_ensemble.py
    layer: research
    purpose: 原生+市集編隊 · config/backtest_standard.yaml ensemble_teams
    report_dir: reports/research/_unified

  run_market_probe_radar:
    path: scripts/research/archive/run_market_probe_radar.py
    layer: research
    purpose: T-1 探針雷達 · archived topic · manual only
    report_dir: reports/daily/regime

  backfill_probe_kbar:
    path: scripts/research/archive/backfill_probe_kbar.py
    layer: research
    purpose: 探針 universe 1m kbar 回灌 · archived
    report_dir: reports/research/market-probe

  run_market_probe_strategy_research:
    path: scripts/research/archive/run_market_probe_strategy_research.py
    layer: research
    purpose: 探針穩定性 · archived topic · manual only
    report_dir: reports/research/market-probe

  run_research_sweep:
    path: scripts/run_research_sweep.py
    layer: research
    purpose: Preregistered sweep grid · sweep_runner trial registry
    schema: config/sweep_trial_registry.example.yaml

  run_daily_sync:
    path: scripts/run_daily_sync.py
    layer: pipeline
    purpose: daily_sync wrapper · 手動重跑收盤管線
